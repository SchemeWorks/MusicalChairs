[package]
name = "musical-chairs-financial-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anchor-lang = "=0.32.1"
bincode = "=1.3.3"
litesvm = "=0.7.1"
solana-sdk = "=2.3.1"
solana-system-interface = { version = "=1.0.0", features = ["bincode"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
solana-loader-v3-interface = { version = "=3.0.0", features = ["bincode"] }
solana-sdk-ids = "=2.2.1"
# local-cluster bootstrap binary (M11 browser verification) only: RPC client + base64 for the validator account fixtures
solana-rpc-client = "=2.3.1"
base64 = "=0.22.1"
musical-chairs-program = { path = "../../programs/musical_chairs", features = ["no-entrypoint"] }
musical-chairs-economics = { path = "../../crates/economics" }

[workspace]
resolver = "2"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
