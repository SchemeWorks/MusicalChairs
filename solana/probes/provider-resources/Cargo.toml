[package]
name = "musical-chairs-provider-resources"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

[dependencies]
anchor-lang = "=0.32.1"
bincode = "=1.3.3"
orao-solana-vrf-cb = { path = "vendor/orao-solana-vrf-cb", default-features = false, features = ["cpi"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
solana-address-lookup-table-interface = "=2.2.2"
solana-sdk = "=2.3.1"
solana-system-interface = "=2.0.0"
thiserror = "=2.0.17"

[lib]
path = "src/lib.rs"

[[bin]]
name = "provider-resource-probe"
path = "src/main.rs"
