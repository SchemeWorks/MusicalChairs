[package]
name = "musical-chairs-runtime-probes"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anchor-lang = "=0.32.1"
bincode = "=1.3.3"
litesvm = "=0.7.1"
solana-sdk = "=2.3.1"
solana-system-interface = { version = "=1.0.0", features = ["bincode"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
orao-solana-vrf-cb = { path = "../../provider-resources/vendor/orao-solana-vrf-cb", default-features = false, features = ["cpi"] }
musical-chairs-runtime-probe-program = { path = "../program", features = ["no-entrypoint"] }
solana-loader-v3-interface = { version = "=3.0.0", features = ["bincode"] }
solana-sdk-ids = "=2.2.1"
