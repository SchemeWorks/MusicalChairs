[package]
name = "musical-chairs-program"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
ethnum = "=1.5.2"
musical-chairs-economics = { path = "../../crates/economics" }
